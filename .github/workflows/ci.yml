name: Sample checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  fixture-policy:
    name: Fixture policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply selected scenario
        shell: bash
        run: |
          scenario="$(tr -d '[:space:]' < .github/check-scenario)"
          case "$scenario" in
            pass) echo "Fixture policy passed" ;;
            fail) echo "::error title=Intentional fixture failure::This check fails by design"; exit 1 ;;
            *) echo "::error title=Unknown fixture scenario::$scenario"; exit 2 ;;
          esac

  optional-slow-check:
    name: Optional slow check
    if: contains(github.event.pull_request.labels.*.name, 'check:slow')
    runs-on: ubuntu-latest
    steps:
      - run: sleep 300
      - run: echo "Slow fixture check passed"

  approval-gate:
    name: Approval gate
    if: contains(github.event.pull_request.labels.*.name, 'check:pending')
    environment: fixture-approval
    runs-on: ubuntu-latest
    steps:
      - run: echo "Fixture approval received"
